name: Bug report
description: Report a reproducible problem with imchips
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic images. Do not upload private photos or disclose security vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: State the bug clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Select a test image ...\n2. Set output ..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version, OS and device
      placeholder: "Chrome 156, Windows 11, desktop"
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Relevant logs or synthetic samples
      description: Do not share personal files or secrets.
    validations:
      required: false
